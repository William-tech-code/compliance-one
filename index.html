<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050b17" />
<title>NEXORA Compliance One</title>
<style>
#nexora-intro{position:fixed;inset:0;z-index:2147483640;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 64%,#113355 0%,#081728 34%,#040810 77%);color:#f4f6fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .65s ease,visibility .65s ease}
#nexora-intro.nexora-exit{opacity:0;visibility:hidden;pointer-events:none}
#nexora-intro:before{content:"";position:absolute;inset:-35%;background:repeating-linear-gradient(90deg,transparent 0 65px,#3ea4ef12 66px 67px),repeating-linear-gradient(0deg,transparent 0 65px,#3ea4ef0c 66px 67px);transform:perspective(650px) rotateX(64deg) translateY(28%);mask-image:linear-gradient(transparent 5%,black 80%);animation:nexora-grid 13s linear infinite}
#nexora-intro .nx-shell{position:relative;width:min(94vw,880px);text-align:center;padding:32px 12px}
#nexora-intro .nx-kicker{font-size:11px;letter-spacing:.45em;color:#9cb9d3;text-transform:uppercase;margin-bottom:18px}
#nexora-intro .nx-brand{font-size:clamp(42px,9vw,96px);font-weight:800;letter-spacing:.11em;line-height:1;background:linear-gradient(110deg,#a9b5c9,#fff 35%,#d7a752 55%,#f4e1ad 70%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 55px #58a8f025}
#nexora-intro .nx-product{font-size:clamp(15px,3vw,27px);letter-spacing:.35em;font-weight:500;margin-top:13px;color:#e7ebf4}
#nexora-intro .nx-product b{color:#d9ac61}
#nexora-intro .nx-orbit{width:clamp(160px,35vw,245px);height:clamp(160px,35vw,245px);margin:35px auto 20px;position:relative;display:grid;place-items:center}
#nexora-intro .nx-orbit:before,#nexora-intro .nx-orbit:after{content:"";position:absolute;inset:0;border:1px solid #4ab8ff73;border-radius:50%;box-shadow:0 0 35px #0074c94d,inset 0 0 30px #0074c930;animation:nexora-orbit 7s linear infinite}
#nexora-intro .nx-orbit:after{inset:17px;border:1px dashed #d6a65a99;animation-direction:reverse;animation-duration:12s}
#nexora-intro .nx-shield{width:105px;height:120px;filter:drop-shadow(0 0 24px #1aabff99);z-index:1}
#nexora-intro .nx-caption{font-size:clamp(12px,2vw,15px);letter-spacing:.14em;color:#bacbdb}
#nexora-intro .nx-track{width:min(320px,78vw);height:3px;background:#63819b45;margin:22px auto 12px;overflow:hidden;border-radius:8px}
#nexora-intro .nx-track span{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,#55c8ff,#f0bc6c);box-shadow:0 0 18px #55c8ff;animation:nexora-load 1.6s ease-in-out infinite}
#nexora-intro .nx-status{font-size:11px;letter-spacing:.17em;color:#9bb4ca}
#nexora-intro .nx-retry{display:none;margin:18px auto 0;padding:11px 19px;border:1px solid #d7ab63;border-radius:9px;background:#10253a;color:#f4e1ad;font:600 13px system-ui;cursor:pointer}#nexora-intro .nx-retry:focus-visible{outline:3px solid #55c8ff;outline-offset:3px}
#nexora-intro .nx-footer{margin-top:25px;color:#d1a866;font-size:10px;letter-spacing:.3em}
#nexora-intro .nx-shell{isolation:isolate;animation:nx-appear .9s cubic-bezier(.2,.8,.2,1) both}
#nexora-intro .nx-shell:before{content:"";position:absolute;z-index:-1;inset:10% -16%;border-radius:50%;background:radial-gradient(ellipse,#07b9fa24 0%,#5a82ff0c 35%,transparent 68%);filter:blur(22px);animation:nx-energy 2.6s ease-in-out infinite alternate}
#nexora-intro .nx-brand{animation:nx-brand 2.8s ease-in-out both}
#nexora-intro .nx-orbit{animation:nx-orbit-enter 1.1s cubic-bezier(.16,1,.3,1) both}
#nexora-intro .nx-shield{animation:nx-shield 2.5s ease-in-out infinite alternate}
#nexora-intro .nx-orbit:before{border-style:dashed;animation-duration:4s}
#nexora-intro .nx-orbit:after{animation-duration:6s}
#nexora-intro .nx-data{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#nexora-intro .nx-data:before,#nexora-intro .nx-data:after{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(90deg,transparent 0 108px,#2cd1ff16 109px 110px,transparent 111px 150px),repeating-linear-gradient(0deg,transparent 0 90px,#2cd1ff11 91px 92px,transparent 93px 140px);mask-image:radial-gradient(ellipse at center,black,transparent 70%);transform:rotate(-8deg);animation:nx-data 12s linear infinite}
#nexora-intro .nx-data:after{transform:rotate(18deg);animation-duration:17s;animation-direction:reverse;opacity:.55}
#nexora-intro .nx-hud{position:absolute;top:24px;left:clamp(16px,3vw,48px);right:clamp(16px,3vw,48px);display:flex;justify-content:space-between;gap:12px;font:600 10px system-ui;letter-spacing:.2em;color:#7ba6c3;pointer-events:none}
#nexora-intro .nx-hud span:last-child{color:#d6b478}
#nexora-intro .nx-track span{width:0;animation:none;transition:width .45s cubic-bezier(.2,.7,.2,1)}
#nexora-intro .nx-status{min-height:16px;transition:opacity .2s ease}
#nexora-intro .nx-skip{display:block;margin:18px auto 0;border:1px solid #5f89a680;border-radius:999px;padding:10px 20px;background:#0c2032ab;color:#d6e9f6;font:600 11px system-ui;letter-spacing:.08em;cursor:pointer;transition:background .2s,border-color .2s}
#nexora-intro .nx-skip:hover,#nexora-intro .nx-skip:focus-visible{background:#16415b;border-color:#65c9f2}
@keyframes nx-appear{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes nx-brand{0%{filter:brightness(.5);letter-spacing:.2em}55%{filter:brightness(1.4)}100%{filter:brightness(1);letter-spacing:.11em}}
@keyframes nx-orbit-enter{from{opacity:0;transform:scale(.65) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes nx-shield{from{filter:drop-shadow(0 0 9px #1aabff77)}to{filter:drop-shadow(0 0 34px #1aabffdd)}}
@keyframes nx-energy{to{transform:scale(1.18);opacity:.55}}
@keyframes nx-data{to{background-position:300px 0,0 280px}}
@keyframes nexora-load{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
@keyframes nexora-orbit{to{transform:rotate(360deg)}}
@keyframes nexora-grid{to{background-position:0 130px,0 130px}}
@media(max-height:610px){#nexora-intro .nx-orbit{margin:15px auto 10px;width:125px;height:125px}#nexora-intro .nx-shield{width:70px;height:80px}#nexora-intro .nx-shell{padding:8px}}
@media(prefers-reduced-motion:reduce){#nexora-intro *,#nexora-intro:before,#nexora-intro .nx-data:before,#nexora-intro .nx-data:after{animation:none!important;transition:none!important}#nexora-intro .nx-track span{width:100%}}
</style>
</head>
<body>
<div id="nexora-intro" role="status" aria-label="Inicializando NEXORA Compliance One">
<div class="nx-data" aria-hidden="true"></div>
<div class="nx-hud" aria-hidden="true"><span>NEXORA / INTELLIGENCE SYSTEM</span><span>ENTERPRISE · 2026</span></div>
<div class="nx-shell">
<div class="nx-kicker">Intelligence &amp; Governance Platform</div>
<div class="nx-brand">NEXORA</div>
<div class="nx-product">COMPLIANCE <b>ONE</b></div>
<div class="nx-orbit" aria-hidden="true">
<svg class="nx-shield" viewBox="0 0 110 130" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M55 5 101 23v37c0 32-19 51-46 65C28 111 9 92 9 60V23L55 5Z" fill="#06182A" stroke="#D7AB63" stroke-width="4"/><path d="M55 17 90 31v30c0 25-13 41-35 53C33 102 20 86 20 61V31l35-14Z" stroke="#40B7FF" stroke-width="2"/><path d="m32 64 16 15 31-34" stroke="#EAC681" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="nx-caption">SEGURANÇA · INTELIGÊNCIA · GOVERNANÇA</div>
<div class="nx-track" aria-hidden="true"><span></span></div>
<div class="nx-status">PREPARANDO SUA EXPERIÊNCIA EXECUTIVA</div>
<button class="nx-skip" type="button">Pular apresentação →</button>
<button class="nx-retry" type="button">Tentar novamente</button>
<div class="nx-footer">POWERED BY NEXORA AI</div>
</div>
</div>
<div id="root"></div>
<script defer src="/intro.js"></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
